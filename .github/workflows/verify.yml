name: Verificar aplicação unificada
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Normalizar lockfile unificado
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile
        if: github.event_name != 'pull_request'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: normaliza lockfile da aplicação unificada"
            git push
          fi
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.lockfile.outputs.revision }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run smoke
      - name: Verificar CMD no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORT = "21992"
          $env:PUBLIC_ORIGIN = "http://localhost:21992"
          $env:DATABASE_PATH = Join-Path $env:RUNNER_TEMP "base-launch-test.sqlite"
          $env:BASE_NO_OPEN = "1"
          $env:BASE_NO_PAUSE = "1"
          $out = Join-Path $env:RUNNER_TEMP "base-launch-out.log"
          $err = Join-Path $env:RUNNER_TEMP "base-launch-err.log"
          $launcher = Start-Process -FilePath "cmd.exe" -ArgumentList "/d", "/c", "INICIAR_SITE.cmd" -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($launcher.HasExited) { throw "O CMD encerrou antes de iniciar o site." }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:21992/api/health" -TimeoutSec 1
                if ($health.service -eq "base-do-suporte") { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "O CMD nao iniciou o site no prazo." }
            Write-Host "CMD validado: servidor respondeu na porta 21992."
          } finally {
            if (-not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
          }
      - run: npm audit --omit=dev
      - name: Publicar build para download
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: base-do-suporte-windows
          include-hidden-files: true
          path: |
            dist/
            src/server/
            content/
            scripts/
            src/client/
            public/
            test/
            package.json
            package-lock.json
            *.json
            *.ts
            .env.example
            index.html
            INICIAR_SITE.cmd
            INICIAR.bat
            README.md
  windows-bootstrap:
    name: CMD instala Node e dependencias do zero
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Iniciar sem Node pre-configurado nem dependencias
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "Base do Suporte com espacos"
          $source = Join-Path $env:RUNNER_TEMP "base-source.zip"
          git archive --format=zip --output=$source HEAD
          if ($LASTEXITCODE -ne 0) { throw "Nao foi possivel preparar a copia limpa." }
          Expand-Archive -LiteralPath $source -DestinationPath $project
          $env:BASE_FORCE_PORTABLE_NODE = "1"
          $env:BASE_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "Runtime do usuario"
          $env:BASE_NO_OPEN = "1"
          $env:BASE_NO_PAUSE = "1"
          $env:PORT = "22992"
          $env:PUBLIC_ORIGIN = "http://localhost:22992"
          $env:DATABASE_PATH = Join-Path $env:RUNNER_TEMP "base-bootstrap.sqlite"
          $stamps = @(".cache/dependencies.sha256", ".cache/frontend.sha256")
          $firstStamps = @{}
          for ($round = 1; $round -le 2; $round++) {
            $out = Join-Path $env:RUNNER_TEMP "base-bootstrap-$round-out.log"
            $err = Join-Path $env:RUNNER_TEMP "base-bootstrap-$round-err.log"
            $launcher = Start-Process -FilePath "cmd.exe" -ArgumentList "/d", "/c", "INICIAR_SITE.cmd" -WorkingDirectory $project -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 240; $attempt++) {
                if ($launcher.HasExited) { throw "O CMD encerrou antes de iniciar o site." }
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:22992/api/health" -TimeoutSec 1
                  if ($health.service -eq "base-do-suporte") { $ready = $true; break }
                } catch {}
                Start-Sleep -Seconds 2
              }
              if (-not $ready) { throw "O CMD nao iniciou o site no prazo." }
              foreach ($required in @("node_modules", "dist/index.html", ".env")) {
                if (-not (Test-Path -LiteralPath (Join-Path $project $required))) { throw "O CMD nao preparou $required." }
              }
              foreach ($stamp in $stamps) {
                $file = Get-Item -LiteralPath (Join-Path $project $stamp)
                if ($round -eq 1) { $firstStamps[$stamp] = $file.LastWriteTimeUtc }
                elseif ($file.LastWriteTimeUtc -ne $firstStamps[$stamp]) { throw "A segunda inicializacao refez $stamp sem necessidade." }
              }
              $log = Get-Content -LiteralPath $out -Raw
              if ($round -eq 1 -and $log -notmatch "Baixando Node.js 24") { throw "O teste nao percorreu a instalacao automatica do Node.js." }
              if ($round -eq 2 -and $log -match "Baixando Node.js 24") { throw "O CMD baixou o Node.js novamente sem necessidade." }
              Write-Host "CMD validado: rodada $round com instalacao por usuario e dependencias automaticas."
            } finally {
              if (-not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
              if (Test-Path $out) { Get-Content $out }
              if (Test-Path $err) { Get-Content $err }
            }
          }

